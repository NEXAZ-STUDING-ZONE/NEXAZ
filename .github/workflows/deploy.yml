name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp cache-busting version
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          for f in index.html app.webmanifest nexaz-worker.js assets/js/nexaz.js assets/js/preload.js; do
            if [ -f "$f" ]; then
              sed -i -E "s/(\.(png|ico|css|js|webp|jpg|svg)|['\"])\?v=[0-9]+/\1?v=${SHA_SHORT}/g" "$f"
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
